[project]
name = "tutor-contrib-notifications"
description = "Tutor companion plugin that manages Open edX notification jobs"
authors = [
  { name = "Andres Gonzalez", email = "andres@aulasneo.com" },
]
license = { text = "AGPLv3" }
license-files = []
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "tutor>=22.0.0,<23.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "black",
  "build",
  "isort",
  "mypy",
  "pylint",
  "twine>=7.0.0",
]

[project.urls]
Code = "https://github.com/aulasneo/tutor-contrib-notifications"
Issues = "https://github.com/aulasneo/tutor-contrib-notifications/issues"

[project.entry-points."tutor.plugin.v1"]
notification-jobs = "tutornotifications.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = ".hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["tutornotifications"]

[tool.black]
target-version = ["py310"]

[tool.hatch.build.targets.sdist]
strict-naming = false
include = ["/tutornotifications", "/README.rst", "/LICENSE.txt", "/CHANGELOG.md", "/.hatch_build.py"]
exclude = ["tests*"]
